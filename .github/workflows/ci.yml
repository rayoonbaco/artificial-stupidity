name: CPU verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install web-test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q -x 'benchmark/evidence/' gate benchmark tests app.py
      - name: Run CPU tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce preserved v0.9.1 adversarial failures
        run: |
          python benchmark/adversarial/v091_probe.py > /tmp/v091_failure_receipt.json
          cmp /tmp/v091_failure_receipt.json benchmark/adversarial/v091_failure_receipt.json
      - name: Run frozen v0.9.2 adversarial campaign
        run: python tools/run_adversarial_campaign.py
      - name: Run frozen Bill X-Ray second-domain validation
        run: python tools/run_bill_xray_second_domain.py
      - name: Verify repository manifest
        run: sha256sum -c INTEGRITY_SHA256.txt
